name: TDR Run Transfer Service tests
on:
  pull_request:
  push:
    branches-ignore:
      - main
      - release-*
permissions:
  id-token: write
  contents: write
jobs:
  test:
    uses: nationalarchives/tdr-github-actions/.github/workflows/tdr_test.yml@51a06bbc08eb65018238b144d0ad8bfd707a8ffa # v0.0.50
    with:
      repo-name: tdr-transfer-service
      test-command: |
        sbt "scalafmtCheckAll; test"
      java-version: '21'
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
