name: TDR Run Transfer Service tests
on:
  pull_request:
  push:
    branches-ignore:
      - main
      - release-*
permissions:
  id-token: write
  contents: write
jobs:
  test:
    uses: nationalarchives/tdr-github-actions/.github/workflows/tdr_test.yml@4b2753940019ebbed38030f1aca49f0eb123a45e # v0.0.55
    with:
      repo-name: tdr-transfer-service
      test-command: |
        sbt "scalafmtCheckAll; test"
      java-version: '21'
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
