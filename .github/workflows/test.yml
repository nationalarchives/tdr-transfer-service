name: TDR Run Transfer Service tests
on:
  pull_request:
  push:
    branches-ignore:
      - main
      - release-*
permissions:
  id-token: write
  contents: write
jobs:
  test:
    uses: nationalarchives/tdr-github-actions/.github/workflows/tdr_test.yml@fc52a93f9636579d7478f01a8a960007134ad30f # v0.0.51
    with:
      repo-name: tdr-transfer-service
      test-command: |
        sbt "scalafmtCheckAll; test"
      java-version: '21'
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
